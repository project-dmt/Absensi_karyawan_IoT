; PlatformIO Project Configuration File
;
; Project: Absensi Karyawan IoT RFID
; Hardware: ESP32 DevKit + RC522 RFID + LCD 16x2 I2C + Buzzer
;
; Setup:
;   1. Copy include/config.example.h -> include/config.h
;   2. Upload ke ESP32
;   3. Set WiFi + IP server + API Key lewat captive portal http://192.168.4.1

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps = 
    miguelbalboa/MFRC522@^1.4.10
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    bblanchon/ArduinoJson@^7.4.1

upload_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
board_upload.use_stub = no
upload_flags =
    --connect-attempts=1
monitor_filters = esp32_exception_decoder

build_flags = 
    -DCORE_DEBUG_LEVEL=3
